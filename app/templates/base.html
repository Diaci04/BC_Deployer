<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BC Deployer{% endblock %} · BC Deployer</title>
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body hx-headers='{{ {"X-CSRF-Token": csrf_token}|tojson }}'>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">BC</span>BC Deployer</a>
    <nav class="nav">
      {% set path = request.url.path %}
      <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="/deploy" {% if path.startswith("/deploy") %}aria-current="page"{% endif %}>Deploy</a>
      <a href="/runs" {% if path.startswith("/runs") %}aria-current="page"{% endif %}>Storico</a>
      <a href="/jobs" {% if path.startswith("/jobs") %}aria-current="page"{% endif %}>Programmati</a>
      <a href="/connections" {% if path.startswith("/connections") %}aria-current="page"{% endif %}>Connessioni</a>
      <a href="/settings" {% if path.startswith("/settings") %}aria-current="page"{% endif %}>Impostazioni</a>
    </nav>
    <form method="post" action="/logout" class="logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn btn-ghost btn-sm" type="submit">Esci</button>
    </form>
  </header>
  {% endif %}
  <main class="container">
    {% if flash %}<div class="alert alert-ok flash" role="status">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
